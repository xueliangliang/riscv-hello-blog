{{ define "main" }}
<section class="listing-page">
  <a class="back-link" href="{{ site.Home.RelPermalink }}">← 首页</a>
  <p class="eyebrow">ARCHIVE</p>
  <h1>{{ .Title }}</h1>
  <div class="post-list">
    {{ range .Pages.ByDate.Reverse }}
      <article class="post-card">
        <div class="post-card-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time></div>
        <h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
        {{ with .Description }}<p>{{ . }}</p>{{ end }}
      </article>
    {{ else }}
      <p class="empty-state">这里暂时还没有文章。</p>
    {{ end }}
  </div>
</section>
{{ end }}
